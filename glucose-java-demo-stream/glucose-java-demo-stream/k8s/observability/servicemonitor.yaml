# Prometheus Operator CRD — scrape automatique de l'application
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: caresync-glucose-reactive
  namespace: caresync
  labels:
    app: caresync-glucose-reactive
    release: prometheus    # doit correspondre au label du Prometheus Operator
spec:
  selector:
    matchLabels:
      app: caresync-glucose-reactive
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
