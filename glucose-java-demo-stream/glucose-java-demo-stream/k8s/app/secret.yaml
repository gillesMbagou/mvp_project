# AVERTISSEMENT : En production, utiliser External Secrets Operator (Vault / AWS SM).
# Les valeurs ci-dessous sont encodées en base64 — NE PAS committer en clair.
# Génération : echo -n "valeur" | base64
apiVersion: v1
kind: Secret
metadata:
  name: caresync-secret
  namespace: caresync
  labels:
    app: caresync-glucose-reactive
type: Opaque
data:
  # caresync_secret → base64
  SPRING_DATASOURCE_PASSWORD: Y2FyZXN5bmNfc2VjcmV0
  # caresync → base64
  SPRING_DATASOURCE_USERNAME: Y2FyZXN5bmM=
