apiVersion: v1
kind: ConfigMap
metadata:
  name: caresync-config
  namespace: caresync
  labels:
    app: caresync-glucose-reactive
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-svc:5432/caresync_db"
  SPRING_DATA_REDIS_HOST: "redis-svc"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
  DEMO_MQTT_BROKER_URL: "tcp://mosquitto-svc:1883"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://keycloak-svc:8080/realms/CareSync"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-svc:4318"
  OTEL_SAMPLING_PROBABILITY: "1.0"
  ENVIRONMENT: "production"
  JPA_DDL_AUTO: "validate"
  DB_POOL_MAX: "20"
  MANAGEMENT_SERVER_PORT: "8081"
