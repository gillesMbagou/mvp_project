server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Collecte les logs de tous les conteneurs Docker du projet CareSync
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=caresync"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: '/?(.*)'
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      # Tente de parser le JSON (logs structurés du profil docker)
      - json:
          expressions:
            level: level
            message: message
            traceId: traceId
            spanId: spanId
            service_name: service
      - labels:
          level:
          traceId:
      - output:
          source: message
