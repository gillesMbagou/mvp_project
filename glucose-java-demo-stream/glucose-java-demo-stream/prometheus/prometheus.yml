global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: docker
    project: caresync

scrape_configs:

  # ── Application Spring Boot (Micrometer + Actuator) ─────────────
  - job_name: caresync-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["caresync-app:8081"]
        labels:
          service: caresync-glucose-reactive

  # ── OTel Collector (métriques de pipeline) ───────────────────────
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  # ── Prometheus lui-même ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
