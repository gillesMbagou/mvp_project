# Mosquitto MQTT Broker — CareSync IoT Gateway

listener 1883
protocol mqtt

# Accepte les connexions anonymes (dev) — activer l'auth en prod
allow_anonymous true

# Connexions simultanées max
max_connections 1000

# Keepalive
keepalive_interval 60

# QoS 1 — at-least-once (garanti pour les mesures IoT)
max_inflight_messages 40
max_queued_messages 200

# Persistance des sessions
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type warning
log_type error

# Retain des dernières mesures par device (utile pour le bootstrap client)
retain_available true
