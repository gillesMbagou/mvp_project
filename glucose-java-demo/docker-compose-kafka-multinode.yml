###############################################################################
#  CareSync — Kafka KRaft (apache/kafka:4.2.1) — Multinode
#
#  Architecture : 3 controllers (quorum Raft) + 3 brokers (réplication 3)
#  Mode         : KRaft sans Zookeeper
#
#  AVANT DE DÉMARRER — générer un Cluster ID (une seule fois) :
#    docker run --rm apache/kafka:4.2.1 kafka-storage.sh random-uuid
#    → Ex : CDKsVvDgQtyz5EP2KWrntQ
#    Remplacer CLUSTER_ID dans les ancres x-controller-env et x-broker-env.
#
#  DÉMARRAGE :
#    docker compose -f docker-compose-kafka-multinode.yml up -d
#
#  RESET COMPLET (repart de zéro) :
#    docker compose -f docker-compose-kafka-multinode.yml down -v
###############################################################################

name: caresync-kafka

networks:
  kafka-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

volumes:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  mosquitto-data:

#  Ancres YAML
x-kafka-image: &kafka-image
  image: apache/kafka:4.2.1
  restart: unless-stopped

# Variables communes à tous les controllers
x-controller-env: &controller-env
  # CRITIQUE : même ID sur TOUS les nœuds du cluster.
  # En Kafka 4.x c'est CLUSTER_ID (sans préfixe KAFKA_) — différence majeure vs 3.x.
  # Sans ça, chaque nœud génère le sien → impossible de former un cluster.
  CLUSTER_ID: "CDKsVvDgQtyz5EP2KWrntQ"

  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
    CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: >-
    1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

  # JVM : controllers légers, 512 Mo suffisent
  KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"

# Variables communes à tous les brokers
x-broker-env: &broker-env
  CLUSTER_ID: "CDKsVvDgQtyz5EP2KWrntQ"

  KAFKA_PROCESS_ROLES: broker
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
    CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: >-
    1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

  #  Réplication — durabilité médicale
  # 3 brokers → replication-factor=3 : chaque message est copié 3 fois.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

  # min.insync.replicas=2 + acks=all côté producteur → on tolère la perte
  # d'1 broker sans perte de données ni blocage des écritures.
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  #  Partitions
  KAFKA_NUM_PARTITIONS: 3

  #  Rétention
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_LOG_SEGMENT_BYTES: 1073741824
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

  #  Taille max des messages (payloads ECG/IoT)
  KAFKA_MESSAGE_MAX_BYTES: 10485760
  KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760

  #  Performances réseau
  KAFKA_NUM_NETWORK_THREADS: 3
  KAFKA_NUM_IO_THREADS: 8
  KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
  KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400

  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # JVM : brokers plus gourmands
  KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

x-broker-healthcheck: &broker-healthcheck
  healthcheck:
    test: ["CMD-SHELL",
           "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 60s

x-broker-depends: &broker-depends
  depends_on:
    controller-1: { condition: service_healthy }
    controller-2: { condition: service_healthy }
    controller-3: { condition: service_healthy }

services:

  ###############################################################################
  #  CONTROLLERS
  #  Rôle : gérer les métadonnées du cluster (leader election, topic config…)
  #  Ils ne stockent PAS les messages applicatifs.
  #  Quorum 3 controllers → tolère la perte d'1 controller sans interruption.
  ###############################################################################

  controller-1:
    <<: *kafka-image
    container_name: caresync-controller-1
    hostname: controller-1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
    volumes:
      - controller-1-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.11
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  controller-2:
    <<: *kafka-image
    container_name: caresync-controller-2
    hostname: controller-2
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes:
      - controller-2-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.12
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  controller-3:
    <<: *kafka-image
    container_name: caresync-controller-3
    hostname: controller-3
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes:
      - controller-3-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.13
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  ###############################################################################
  #  BROKERS
  #  Rôle : stocker et servir les messages applicatifs.
  #  Deux listeners par broker :
  #    PLAINTEXT      (19092) → communication inter-brokers (réseau Docker interne)
  #    PLAINTEXT_HOST (9092)  → accès depuis l'hôte (localhost:29092/39092/49092)
  ###############################################################################

  broker-1:
    <<: [*kafka-image, *broker-depends, *broker-healthcheck]
    container_name: caresync-broker-1
    hostname: broker-1
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092"
    volumes:
      - broker-1-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.21
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"

  broker-2:
    <<: [*kafka-image, *broker-depends, *broker-healthcheck]
    container_name: caresync-broker-2
    hostname: broker-2
    ports:
      - "127.0.0.1:39092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092"
    volumes:
      - broker-2-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.22
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"

  broker-3:
    <<: [*kafka-image, *broker-depends, *broker-healthcheck]
    container_name: caresync-broker-3
    hostname: broker-3
    ports:
      - "127.0.0.1:49092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092"
    volumes:
      - broker-3-data:/var/lib/kafka/data
    networks:
      kafka-net:
        ipv4_address: 172.26.0.23
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"

  ###############################################################################
  #  KAFKA UI — interface d'administration
  #  Accès : http://localhost:8090
  ###############################################################################

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: caresync-kafka-ui
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: caresync-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-net
    depends_on:
      broker-1: { condition: service_healthy }
    restart: unless-stopped


  #  Mosquitto MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: libre-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"    # MQTT
      - "127.0.0.1:9001:9001"    # WebSocket
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    networks: [kafka-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t health -m ping -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ###############################################################################
  #  KAFKA INIT — crée les topics CareSync au premier démarrage
  #  Se termine automatiquement après exécution (restart: no)
  #
  #  PATH explicite : évite le "command not found" sur kafka-topics.sh
  #  quand le container est lancé avec un entrypoint personnalisé.
  ###############################################################################

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: caresync-kafka-init
    restart: "no"
    networks:
      - kafka-net
    environment:
      PATH: "/opt/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    depends_on:
      broker-1: { condition: service_healthy }
      broker-2: { condition: service_healthy }
      broker-3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        BS=broker-1:19092
        RF=3
        echo '=== Création des topics CareSync ==='

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.iot.observations --partitions 6 --replication-factor $$RF \
          --config retention.ms=604800000 --config min.insync.replicas=2 \
          --config max.message.bytes=10485760
        echo '  caresync.iot.observations (6 partitions, 7j)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.alerts --partitions 3 --replication-factor $$RF \
          --config retention.ms=2592000000 --config min.insync.replicas=2
        echo '  caresync.alerts (30j)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.alerts.escalation --partitions 3 --replication-factor $$RF \
          --config retention.ms=2592000000 --config min.insync.replicas=2
        echo '  caresync.alerts.escalation (30j)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.notifications --partitions 3 --replication-factor $$RF \
          --config retention.ms=604800000
        echo '  caresync.notifications (7j)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.audit --partitions 3 --replication-factor $$RF \
          --config retention.ms=63072000000 --config cleanup.policy=compact
        echo '  caresync.audit (2 ans HDS, compaction activée)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.iot.observations.dlq --partitions 1 --replication-factor $$RF
        echo '  caresync.iot.observations.dlq'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic caresync.alerts.dlq --partitions 1 --replication-factor $$RF
        echo '  caresync.alerts.dlq'

        echo ''
        echo '=== Topics Glucose ==='

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic glucose.raw --partitions 3 --replication-factor $$RF \
          --config retention.ms=86400000 --config min.insync.replicas=2
        echo '  glucose.raw (3 partitions, 24h)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic glucose.alerts --partitions 3 --replication-factor $$RF \
          --config retention.ms=86400000 --config min.insync.replicas=2
        echo '  glucose.alerts (3 partitions, 24h)'

        kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
          --topic glucose.processed --partitions 3 --replication-factor $$RF \
          --config retention.ms=86400000 --config min.insync.replicas=2
        echo '  glucose.processed (3 partitions, 24h)'

        echo ''
        echo '=== Topics actifs ==='
        kafka-topics.sh --bootstrap-server $$BS --list
