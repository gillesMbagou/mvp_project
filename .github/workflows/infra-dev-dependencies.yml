name: Infra dev — dépendances (Kafka/Postgres/Keycloak/Vault/Redis/Mosquitto)

# Déclenchement manuel uniquement : ces dépendances ne changent pas à chaque
# push applicatif, contrairement aux images des microservices. À relancer
# après modification d'un fichier infra/helm/dev-dependencies/values/*.
on:
  workflow_dispatch: {}

env:
  BACKEND_DIR: files-qrk/caresync-microservices-quarkus-complet/caresync-quarkus

jobs:
  install:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Configurer kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > "$HOME/.kube/config"

      - name: Namespace caresync
        run: kubectl create namespace caresync --dry-run=client -o yaml | kubectl apply -f -

      - name: Ajouter les repos Helm
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update

      - name: Realm Keycloak dev (ConfigMap)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          kubectl -n caresync create configmap keycloak-realm-dev \
            --from-file=caresync-realm.json=infra/keycloak/caresync-realm-dev.json \
            --dry-run=client -o yaml | kubectl apply -f -

      # Manifeste brut (pas un chart Helm) : image officielle timescale/timescaledb,
      # nécessaire pour que les requêtes time_bucket() de caresync-q-analytics
      # trouvent l'extension timescaledb — absente de l'image bitnami/postgresql
      # utilisée jusqu'ici (cf. infra/helm/dev-dependencies/timescaledb/deployment.yaml).
      #
      # Le "helm uninstall" ci-dessous supprime l'ancien StatefulSet+PVC bitnami
      # (release "postgres") s'il existe encore d'un run précédent : sans ça, son
      # Service "postgres" (même nom, sélecteur de labels différent) entre en
      # conflit avec celui posé par kubectl apply juste après, et les deux
      # Postgres (bitnami sans Timescale / le nouveau avec) se répondraient en
      # alternance derrière le même Service. Idempotent (--ignore-not-found
      # n'existe pas sur "helm uninstall" : on avale l'erreur si la release
      # n'existe pas déjà, ex. sur un cluster jamais provisionné avec l'ancien chart).
      - name: Postgres + TimescaleDB (multi-DB)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          helm uninstall postgres -n caresync 2>/dev/null || true
          kubectl kustomize infra/helm/dev-dependencies/timescaledb | kubectl apply -f -
          kubectl -n caresync rollout status deployment/postgres --timeout=5m

      - name: Kafka
        working-directory: ${{ env.BACKEND_DIR }}
        run: helm upgrade --install kafka bitnami/kafka -n caresync -f infra/helm/dev-dependencies/values/kafka-values.yaml --wait --timeout 5m

      - name: Redis
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          helm upgrade --install redis bitnami/redis -n caresync -f infra/helm/dev-dependencies/values/redis-values.yaml --wait --timeout 5m
          kubectl apply -f infra/helm/dev-dependencies/redis-alias-service.yaml

      - name: Keycloak
        working-directory: ${{ env.BACKEND_DIR }}
        run: helm upgrade --install keycloak bitnami/keycloak -n caresync -f infra/helm/dev-dependencies/values/keycloak-values.yaml --wait --timeout 8m

      - name: Vault (mode dev)
        working-directory: ${{ env.BACKEND_DIR }}
        run: helm upgrade --install vault hashicorp/vault -n caresync -f infra/helm/dev-dependencies/values/vault-values.yaml

      - name: Mosquitto
        working-directory: ${{ env.BACKEND_DIR }}
        run: kubectl kustomize infra/helm/dev-dependencies/mosquitto | kubectl apply -f -
