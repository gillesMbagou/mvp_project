name: Frontend CD — prod (caresync-ng22)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  FRONTEND_DIR: files-qrk/caresync-microservices-quarkus-complet/caresync-ng22
  BACKEND_DIR: files-qrk/caresync-microservices-quarkus-complet/caresync-quarkus
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  ci:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push caresync-frontend:${{ github.ref_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=caresync-frontend
          cache-to: type=gha,mode=max,scope=caresync-frontend

      - name: Scan Trivy (bloquant sur CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: azure/setup-kubectl@v4

      - name: Configurer kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"

      - name: Appliquer uniquement les ressources frontend
        working-directory: files-qrk/caresync-microservices-quarkus-complet/caresync-quarkus/infra/k8s/overlays/prod
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image caresync-frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:${{ github.ref_name }}

          # Même raisonnement que frontend-cd-dev.yml : n'appliquer QUE les
          # ressources frontend, jamais le ConfigMap/Secrets/Deployments
          # backend partagés par l'overlay entier (ce workflow n'a d'ailleurs
          # pas accès aux secrets PROD_* nécessaires pour les régénérer
          # correctement — c'est backend-cd-prod.yml qui en a la charge).
          cp configmap-prod.env.example configmap-prod.env
          sed -i "s/\${[A-Z_]*}/x/g" configmap-prod.env

          kubectl kustomize . | yq 'select(.metadata.name == "caresync-frontend")' | kubectl apply -f -
          rm -f configmap-prod.env
          kubectl -n caresync rollout status deployment/caresync-frontend --timeout=120s
