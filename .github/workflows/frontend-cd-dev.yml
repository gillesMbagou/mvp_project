name: Frontend CD — dev (caresync-ng22)

on:
  push:
    branches: [develop]
    paths: ["files-qrk/caresync-microservices-quarkus-complet/caresync-ng22/**"]
  workflow_dispatch: {}

env:
  FRONTEND_DIR: files-qrk/caresync-microservices-quarkus-complet/caresync-ng22
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  ci:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push caresync-frontend:sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=caresync-frontend
          cache-to: type=gha,mode=max,scope=caresync-frontend

      - name: Scan Trivy (bloquant sur CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: azure/setup-kubectl@v4

      - name: Configurer kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > "$HOME/.kube/config"

      - name: Appliquer uniquement les ressources frontend
        working-directory: files-qrk/caresync-microservices-quarkus-complet/caresync-quarkus/infra/k8s/overlays/dev
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image caresync-frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/caresync-frontend:sha-${{ github.sha }}

          # overlays/dev couvre les 12 services (11 backend + frontend) dans un
          # seul kustomization, mais ce workflow ne reconstruit QUE le
          # frontend. `kubectl apply -k` sur l'overlay entier régénérerait
          # aussi le ConfigMap/Secrets communs et l'image des 11 Deployments
          # backend avec leurs valeurs placeholder du manifeste commité,
          # régressant leur dernier déploiement réel. yq filtre donc le flux
          # pour n'appliquer que les 2 documents nommés "caresync-frontend"
          # (Deployment + Service) — build+db.env factices, jamais utilisés
          # par le Deployment frontend, juste requis pour que le
          # secretGenerator ne fasse pas échouer le rendu kustomize.
          echo -e "DB_USER=x\nDB_PASS=x" > secrets/db.env
          kubectl kustomize . | yq 'select(.metadata.name == "caresync-frontend")' | kubectl apply -f -
          rm -f secrets/db.env
          kubectl -n caresync rollout status deployment/caresync-frontend --timeout=120s
