quarkus:
  application:
    name: caresync-messaging-svc
  http:
    port: 8098

  # caresync-q-common est une dépendance "plain jar" : sans ceci, Quarkus ne
  # scanne pas ses classes pour la découverte de beans CDI (ex. DevVaultSecretSeeder).
  index-dependency:
    caresync-common:
      group-id: be.caresync
      artifact-id: caresync-q-common

  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8180/realms/caresync}
    client-id: caresync-messaging-svc

  datasource:
    db-kind: postgresql
  hibernate-orm:
    database:
      generation: update

# Note : quarkus.datasource.{username,password,jdbc.url} / quarkus.redis.hosts /
# kafka.bootstrap.servers ne sont volontairement PAS fixés ici : les définir
# désactive les Dev Services (Postgres, Redis, Kafka) qui démarrent
# automatiquement des conteneurs jetables en %dev. Ils sont configurés
# explicitement en %prod, où c'est Vault qui fournit le vrai mot de passe
# (pas de Dev Services en prod).

"%dev":
  quarkus:
    devservices:
      enabled: true
    vault:
      kv-secret-engine-version: 2
      kv-secret-engine-mount-path: secret
      devservices:
        enabled: true
        # Le seeding du secret de dev est fait par be.caresync.common.vault.DevVaultSecretSeeder
        # (bean CDI actif en profil dev), pas par init-commands (trop fragile). Le chemin est une
        # propriété applicative (pas secret-config-kv-path, lue "eager" au boot et donc fatale
        # si le chemin n'existe pas encore dans un Vault Dev Services fraîchement créé).
  app:
    vault:
      demo-secret-path: caresync/messaging

"%prod":
  quarkus:
    datasource:
      username: ${DB_USER:caresync}
      password: ${DB_PASS:caresync}
      jdbc:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/caresync_messaging
    redis:
      hosts: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap:
      servers: ${KAFKA_BROKERS:localhost:29092}
