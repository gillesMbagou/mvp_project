quarkus:
  application:
    name: caresync-messaging-svc
  http:
    port: 8098

  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8180/realms/caresync}
    client-id: caresync-messaging-svc

  datasource:
    db-kind: postgresql
    username: ${DB_USER:caresync}
    password: ${DB_PASS:caresync}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:5432/caresync_messaging
  hibernate-orm:
    database:
      generation: update

  redis:
    hosts: ${REDIS_URL:redis://localhost:6379}

  vault:
    kv-secret-engine-version: 2
    kv-secret-engine-mount-path: secret
    secret-config-kv-path: caresync/messaging

kafka:
  bootstrap:
    servers: ${KAFKA_BROKERS:localhost:29092}

"%dev":
  quarkus:
    devservices:
      enabled: true
    vault:
      devservices:
        enabled: true

"%prod":
  quarkus:
    vault:
      url: ${VAULT_ADDR:https://vault.caresync.internal:8200}
      authentication:
        kubernetes:
          role: caresync-messaging-svc
          jwt-token-path: /var/run/secrets/kubernetes.io/serviceaccount/token
