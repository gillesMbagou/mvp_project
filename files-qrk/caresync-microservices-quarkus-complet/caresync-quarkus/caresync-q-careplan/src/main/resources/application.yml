quarkus:
  application:
    name: caresync-careplan-svc
  http:
    port: 8094

  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8180/realms/caresync}
    client-id: caresync-careplan-svc

  datasource:
    db-kind: postgresql
    username: ${DB_USER:caresync}
    password: ${DB_PASS:caresync}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:5432/caresync_careplan
  hibernate-orm:
    database:
      generation: update

  vault:
    kv-secret-engine-version: 2
    kv-secret-engine-mount-path: secret
    secret-config-kv-path: caresync/careplan

kafka:
  bootstrap:
    servers: ${KAFKA_BROKERS:localhost:29092}

"%dev":
  quarkus:
    devservices:
      enabled: true
    vault:
      devservices:
        enabled: true

"%prod":
  quarkus:
    vault:
      url: ${VAULT_ADDR:https://vault.caresync.internal:8200}
      authentication:
        kubernetes:
          role: caresync-careplan-svc
          jwt-token-path: /var/run/secrets/kubernetes.io/serviceaccount/token
