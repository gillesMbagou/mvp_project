quarkus:
  application:
    name: caresync-iot-svc

  # caresync-q-common est une dépendance "plain jar" : sans ceci, Quarkus ne
  # scanne pas ses classes pour la découverte de beans CDI (ex. DevVaultSecretSeeder).
  index-dependency:
    caresync-common:
      group-id: be.caresync
      artifact-id: caresync-q-common

  http:
    port: 8092
    # ── CORS ──────────────────────────────────────────────────────────
    cors:
      "~": true
      origins: http://localhost:4200,https://app.caresync.be
      methods: GET,POST,PUT,DELETE,OPTIONS

  # ── OIDC / Keycloak ──────────────────────────────────────────────────
  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8180/realms/caresync}
    client-id: caresync-iot-svc
    tls:
      verification: none

  # ── Base de données ───────────────────────────────────────────────────
  datasource:
    db-kind: postgresql
  hibernate-orm:
    database:
      generation: update

# ── MQTT + Kafka : SmallRye Reactive Messaging ──────────────────────────
mp:
  messaging:
    incoming:
      mqtt-glucose:
        connector: smallrye-mqtt
        host: ${MQTT_HOST:localhost}
        port: 1883
        topic: caresync/devices/+/glucose
        auto-reconnect: true
        keep-alive-seconds: 30
      mqtt-spo2:
        connector: smallrye-mqtt
        host: ${MQTT_HOST:localhost}
        port: 1883
        topic: caresync/devices/+/spo2
      mqtt-weight:
        connector: smallrye-mqtt
        host: ${MQTT_HOST:localhost}
        port: 1883
        topic: caresync/devices/+/weight
      observations-sse:
        connector: smallrye-kafka
        topic: caresync.iot.observations
        group:
          id: caresync-iot-sse
        auto:
          offset:
            reset: latest
        broadcast: true
        value:
          deserializer: be.caresync.common.events.IoTObservationEventDeserializer
    outgoing:
      observations-out:
        connector: smallrye-kafka
        topic: caresync.iot.observations
        merge: true
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Note : quarkus.datasource.{username,password,jdbc.url} / kafka.bootstrap.servers
# ne sont volontairement PAS fixés ici : les définir désactive les Dev Services
# (Postgres, Kafka) qui démarrent automatiquement des conteneurs jetables en %dev.
# Ils sont configurés explicitement en %prod, où c'est Vault qui fournit le
# vrai mot de passe (pas de Dev Services en prod).

# ── Dev Services (uniquement en mode dev: mvn quarkus:dev) ───────────
# Quarkus démarre automatiquement PostgreSQL, Kafka et Vault en Docker !
"%dev":
  quarkus:
    devservices:
      enabled: true
    kafka:
      devservices:
        enabled: true
    vault:
      kv-secret-engine-version: 2
      kv-secret-engine-mount-path: secret
      devservices:
        enabled: true
        # Le seeding du secret de dev est fait par be.caresync.common.vault.DevVaultSecretSeeder
        # (bean CDI actif en profil dev), pas par init-commands (trop fragile). Le chemin est une
        # propriété applicative (pas secret-config-kv-path, lue "eager" au boot et donc fatale
        # si le chemin n'existe pas encore dans un Vault Dev Services fraîchement créé).
  app:
    vault:
      demo-secret-path: caresync/iot

"%prod":
  quarkus:
    datasource:
      username: ${DB_USER:caresync}
      password: ${DB_PASS:caresync}
      jdbc:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/caresync_iot
  kafka:
    bootstrap:
      servers: ${KAFKA_BROKERS:localhost:29092}
