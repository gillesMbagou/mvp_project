quarkus:
  application:
    name: caresync-alert-svc
  http:
    port: 8093

  oidc:
    auth-server-url: ${KEYCLOAK_URL:http://localhost:8180/realms/caresync}
    client-id: caresync-alert-svc

  datasource:
    db-kind: postgresql
    username: ${DB_USER:caresync}
    password: ${DB_PASS:caresync}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:5432/caresync_alerts
  hibernate-orm:
    database:
      generation: update

  # Secrets Vault : les clés stockées à ce chemin (ex. quarkus.datasource.password)
  # surchargent automatiquement les valeurs ci-dessus si elles sont présentes.
  vault:
    kv-secret-engine-version: 2
    kv-secret-engine-mount-path: secret
    secret-config-kv-path: caresync/alert

kafka:
  bootstrap:
    servers: ${KAFKA_BROKERS:localhost:29092}

# ── Kafka consumers + producers ──────────────────────────────────────
mp:
  messaging:
    incoming:
      iot-observations:
        connector: smallrye-kafka
        topic: caresync.iot.observations
        group:
          id: caresync-alert-engine
        auto:
          offset:
            reset: earliest
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: caresync.iot.observations.dlq
        value:
          deserializer: be.caresync.common.events.IoTObservationEventDeserializer
    outgoing:
      clinical-alerts:
        connector: smallrye-kafka
        topic: caresync.alerts
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer

"%dev":
  quarkus:
    devservices:
      enabled: true
    vault:
      devservices:
        enabled: true

"%prod":
  quarkus:
    vault:
      url: ${VAULT_ADDR:https://vault.caresync.internal:8200}
      authentication:
        kubernetes:
          role: caresync-alert-svc
          jwt-token-path: /var/run/secrets/kubernetes.io/serviceaccount/token
