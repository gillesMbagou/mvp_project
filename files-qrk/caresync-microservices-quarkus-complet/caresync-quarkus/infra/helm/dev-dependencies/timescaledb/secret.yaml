# Identifiants dev en clair, à l'identique de l'ancien postgres-values.yaml
# (auth.username/password) : dev uniquement, même posture de risque qu'avant.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
