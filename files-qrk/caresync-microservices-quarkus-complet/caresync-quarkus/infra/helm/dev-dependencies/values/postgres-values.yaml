# helm upgrade --install postgres bitnami/postgresql -n caresync -f postgres-values.yaml
#
# 1 replica, léger, sans HA — dev uniquement. fullnameOverride=postgres pour
# matcher DB_HOST=postgres dans overlays/dev/kustomization.yaml. Un script
# d'init crée les 11 bases (une par microservice) au premier démarrage.
fullnameOverride: postgres

auth:
  username: caresync
  password: devpassword
  database: caresync_patient
  postgresPassword: devpassword

architecture: standalone

primary:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  initdb:
    scripts:
      init-caresync-dbs.sql: |
        CREATE DATABASE caresync_etablissement OWNER caresync;
        CREATE DATABASE caresync_iot OWNER caresync;
        CREATE DATABASE caresync_alert OWNER caresync;
        CREATE DATABASE caresync_careplan OWNER caresync;
        CREATE DATABASE caresync_prescription OWNER caresync;
        CREATE DATABASE caresync_dossier OWNER caresync;
        CREATE DATABASE caresync_messaging OWNER caresync;
        CREATE DATABASE caresync_analytics OWNER caresync;
        CREATE DATABASE caresync_audit OWNER caresync;
        -- caresync_patient déjà créée via auth.database ci-dessus
        -- caresync-q-gateway n'a pas de base propre (proxy stateless)

volumePermissions:
  enabled: false
