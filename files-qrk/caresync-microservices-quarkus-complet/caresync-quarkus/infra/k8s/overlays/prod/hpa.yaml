# HPA prod pour les 11 microservices (pas d'HPA en dev, replicas=1 fixe).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: caresync-q-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: caresync-q-gateway
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
