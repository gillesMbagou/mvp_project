apiVersion: apps/v1
kind: Deployment
metadata:
  name: caresync-q-audit
  labels:
    app.kubernetes.io/name: caresync-q-audit
    app.kubernetes.io/part-of: caresync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caresync-q-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caresync-q-audit
        app.kubernetes.io/part-of: caresync
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8100"
    spec:
      serviceAccountName: caresync-audit
      containers:
        - name: app
          image: caresync-q-audit
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: caresync-common-config
            - secretRef:
                name: caresync-audit-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
