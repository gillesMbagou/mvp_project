
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: caresync-ratelimit
spec:
  rateLimit:
    average: 30
    burst: 60

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: caresync-jwt
spec:
  forwardAuth:
    address: http://keycloak:8180/realms/caresync/protocol/openid-connect/userinfo
    authResponseHeaders:
      - X-User-Id
      - X-User-Roles

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: |
      default-caresync-jwt@kubernetescrd,
      default-caresync-ratelimit@kubernetescrd
spec:
  rules:
    - host: api.caresync.be
      http:
        paths:
          - path: /api/v1/patients
            pathType: Prefix
            backend:
              service:
                name: caresync-q-patient
                port:
                  number: 8097
          - path: /api/v1/etablissements
            pathType: Prefix
            backend:
              service:
                name: caresync-q-etablissement
                port:
                  number: 8091
          - path: /api/v1/alerts
            pathType: Prefix
            backend:
              service:
                name: caresync-q-alert
                port:
                  number: 8093