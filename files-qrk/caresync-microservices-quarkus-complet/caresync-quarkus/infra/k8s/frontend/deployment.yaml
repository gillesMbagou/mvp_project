apiVersion: apps/v1
kind: Deployment
metadata:
  name: caresync-frontend
  labels:
    app.kubernetes.io/name: caresync-frontend
    app.kubernetes.io/part-of: caresync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caresync-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caresync-frontend
        app.kubernetes.io/part-of: caresync
    spec:
      containers:
        - name: app
          image: caresync-frontend
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
