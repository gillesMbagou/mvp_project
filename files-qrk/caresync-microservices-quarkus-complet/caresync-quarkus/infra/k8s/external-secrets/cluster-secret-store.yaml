# ClusterSecretStore : point d'entrée unique vers Vault pour tous les
# ExternalSecret du cluster (staging comme prod — seul le "path" et le "role"
# diffèrent selon l'environnement où ce manifeste est appliqué).
#
# Le "role" référencé ici doit correspondre à un rôle créé par Terraform
# (voir infra/terraform/vault/kubernetes_auth.tf, sortie `service_roles`).
# Comme chaque service a son propre rôle/policy (moindre privilège), il faut
# en réalité un ClusterSecretStore par service, OU un seul store générique
# combiné à un rôle "lecture large" si on préfère centraliser — ce manifeste
# illustre l'option "un store dédié par service", cohérente avec les policies
# Vault déjà scoped par service.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-caresync-patient
spec:
  provider:
    vault:
      server: "https://vault.caresync.internal:8200"
      path: "secret" # kv_mount_path du module Terraform
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes-production" # kubernetes_auth_backend_path (sortie Terraform)
          role: "caresync-patient" # service_roles["patient"] (sortie Terraform)
          serviceAccountRef:
            name: caresync-patient
            namespace: caresync
