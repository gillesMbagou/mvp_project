# ExternalSecret représentatif pour caresync-q-patient. Le même patron
# s'applique aux 9 autres microservices (alert, analytics, audit, careplan,
# dossier, etablissement, iot, messaging, prescription) : dupliquer ce fichier
# en changeant "patient" -> "<service>" partout (nom, secretStoreRef, chemin
# distant remoteRef.key) et en adaptant les clés `data` remontées.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: caresync-patient-secrets
  namespace: caresync
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-caresync-patient
    kind: ClusterSecretStore
  target:
    name: caresync-patient-secrets # nom du Secret K8s natif créé/mis à jour par ESO
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: caresync/patient # chemin KV (sans le préfixe "secret/", déjà dans le store)
        property: quarkus.datasource.username
    - secretKey: DB_PASS
      remoteRef:
        key: caresync/patient
        property: quarkus.datasource.password
