# Généré depuis le patron patient-external-secret.yaml — mêmes clés
# (quarkus.datasource.username/password), chemin Vault propre au service.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: caresync-careplan-secrets
  namespace: caresync
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-caresync-careplan
    kind: ClusterSecretStore
  target:
    name: caresync-careplan-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: caresync/careplan
        property: quarkus.datasource.username
    - secretKey: DB_PASS
      remoteRef:
        key: caresync/careplan
        property: quarkus.datasource.password
