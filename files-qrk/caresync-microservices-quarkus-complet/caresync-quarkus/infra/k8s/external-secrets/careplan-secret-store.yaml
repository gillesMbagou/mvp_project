# Généré depuis le patron cluster-secret-store.yaml (service patient) — voir
# ce fichier pour les commentaires détaillés sur le choix "1 store par service".
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-caresync-careplan
spec:
  provider:
    vault:
      server: "https://vault.caresync.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes-production"
          role: "caresync-careplan"
          serviceAccountRef:
            name: caresync-careplan
            namespace: caresync
