name: caresync

networks:
  caresync-net:
    driver: bridge

volumes:
  postgres-data:
  keycloak-data:
  kafka-data:
  vault-data:
  mosquitto-data:
  mosquitto-log:

services:

  postgres:
    image: postgres:16-alpine
    container_name: caresync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: caresync_secret
      POSTGRES_MULTIPLE_DATABASES: caresync,keycloak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [caresync-net]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U caresync"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: caresync-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: caresync
      KC_DB_PASSWORD: caresync_secret
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    networks: [caresync-net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  # Kafka — KRaft mode, single-node (controller + broker combined)
  kafka:
    image: apache/kafka:4.2.1
    container_name: caresync-kafka
    restart: unless-stopped
    hostname: kafka
    ports:
      # PLAINTEXT_HOST: host-side access — matches spring.kafka.bootstrap-servers=localhost:9092
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Listeners
      # PLAINTEXT      → inter-container traffic on port 19092 (Docker network)
      # PLAINTEXT_HOST → host-to-container on port 9092 (mapped above)
      # CONTROLLER     → KRaft quorum on port 9093 (internal only)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      # Topic defaults — single-broker dev setup (replication factor must be 1)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Matches producer config: acks=all with a single broker
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Consumer groups used by the application
      # caresync-backend    → KafkaConfig default group
      # caresync-ingestion  → IoTIngestionService (@KafkaListener on caresync.iot.observations)
      # caresync-notifications → NotificationService (@KafkaListener on caresync.alerts)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Log retention: 7 days
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [caresync-net]
    healthcheck:
      test: ["CMD-SHELL","kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: caresync-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"   # MQTT
      - "127.0.0.1:9001:9001"   # WebSocket
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks: [caresync-net]
    healthcheck:
      test: ["CMD-SHELL","mosquitto_pub -h localhost -p 1883 -t health -m ping -u caresync -P mqtt_secret || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault — dev mode (auto-unsealed, token = caresync-root-token)
  # Seed secrets after first start: docker compose exec vault sh /vault/init/01-seed-secrets.sh
  vault:
    image: hashicorp/vault:1.17
    container_name: caresync-vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: vault server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=caresync-root-token
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./infra/vault/init:/vault/init:ro
    networks: [caresync-net]
    healthcheck:
      test: ["CMD-SHELL","vault status -address=http://localhost:8200 | grep -q 'Sealed.*false'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Kafka UI — enable with: docker compose --profile tools up
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: caresync-kafka-ui
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: caresync
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:8090:8080"
    networks: [caresync-net]
    depends_on:
      kafka:
        condition: service_healthy
