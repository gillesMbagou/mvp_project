spring:
  application:
    name: caresync-backend

  config:
    import: "optional:vault://"

  datasource:
    url: jdbc:postgresql://localhost:5432/caresync
    username: caresync
    password: caresync_secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère les migrations en prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 25
    open-in-view: false           # Désactivé — bonnes pratiques

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: caresync-backend
      auto-offset-reset: earliest

  # Keycloak / OAuth2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/caresync
          jwk-set-uri: http://localhost:8080/realms/caresync/protocol/openid-connect/certs

  # ── Scheduler ─────────────────────────────────────────────────────────────
  task:
    scheduling:
      pool:
        size: 5

  # ── Cloud / Vault ─────────────────────────────────────────────────────────
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      token: caresync-root-token
      kv:
        enabled: true
        backend: secret
        default-context: caresync
    discovery:
      enabled: false              # Désactive la découverte de services simple qui cause des erreurs au démarrage

# MQTT
caresync:
  mqtt:
    broker-url: tcp://localhost:1883
    username: caresync
    password: mqtt_secret

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: caresync-swagger
      realm: caresync

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    be.caresync: DEBUG
    org.springframework.security: INFO
    org.apache.kafka: WARN
    org.eclipse.paho: INFO
